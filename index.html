    <script>
      // Safeguard for environments (e.g. sandboxed iframes) where window.fetch has only a getter.
      // Defines both getter and setter so that any script attempting `window.fetch = ...` succeeds.
      (function() {
        try {
          var originalFetch = window.fetch;
          if (typeof originalFetch === 'function') {
            var currentFetch = originalFetch;
            try {
              Object.defineProperty(window, 'fetch', {
                get: function() {
                  return currentFetch;
                },
                set: function(fn) {
                  currentFetch = fn;
                },
                configurable: true,
                enumerable: true
              });
            } catch (e1) {
              try {
                Object.defineProperty(window, 'fetch', {
                  value: originalFetch,
                  writable: true,
                  configurable: true,
                  enumerable: true
                });
              } catch (e2) {}
            }
          }
        } catch (e) {}
      })();
    </script>
